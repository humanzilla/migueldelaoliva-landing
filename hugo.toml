baseURL                = "https://www.migueldelaoliva.com/"
locale                 = "es-BO"
defaultContentLanguage = "es"
title                  = "Dr. Miguel de la Oliva | Psiquiatra Especialista en Autismo y Adicciones | Santa Cruz, Bolivia"
enableRobotsTXT        = true
enableGitInfo          = false

[languages.es]
  label  = "Español"
  weight = 1

  # No taxonomies on this site
  disableKinds = ["taxonomy", "term"]

[params]
  description = "Dr. Miguel de la Oliva, psiquiatra especialista en autismo y adicciones en Santa Cruz de la Sierra. Consultas clínicas, educación en salud mental y apoyo a familias."
  keywords = [
    "psiquiatra",
    "autismo",
    "adicciones",
    "salud mental",
    "Santa Cruz",
    "Bolivia",
    "consulta psiquiátrica",
    "terapia",
    "inclusión",
  ]
  author = "Dr. Miguel Angel de la Oliva"
  ogImage = "/images/profile-miguel-oliva.jpg"
  twitterCard = "summary_large_image"
  themeColor = "#1f2937"

  [params.contact]
    building    = "Edificio Las Palmas Golf View"
    addressLine = "Avenida Ibérica y Calle 2"
    unit        = "Piso 2, Apartamento 20"
    city        = "Santa Cruz de la Sierra"
    region      = "Santa Cruz"
    country     = "Bolivia"
    countryCode = "BO"
    latitude    = -17.8035547
    longitude   = -63.2099454
    mapUrl      = "https://maps.app.goo.gl/rxsUtVZS3LtbASoN6"
    phone       = "+591 6000 5594"
    phoneE164   = "+59160005594"
    hours       = "Lunes a Sábados: 15:00 - 18:00"
    specialties = "Autismo • Adicciones • Salud Mental General"
    modality    = "Consulta presencial"
    insurance   = "Consulta por convenios disponibles"

    # Horario estructurado para el JSON-LD (openingHoursSpecification).
    # `hours`, arriba, es la versión legible que se muestra en la página; las dos
    # deben decir lo mismo. Los días usan los nombres de schema.org, que la
    # plantilla convierte a https://schema.org/Monday, etc.
    [[params.contact.openingHours]]
      days   = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]
      opens  = "15:00"
      closes = "18:00"

  [params.hero]
    # `h1` lleva la especialidad y la ciudad; `subheadline` lleva las áreas de
    # consulta. Entre las dos dicen, en la primera pantalla, quién es y dónde
    # atiende — que es lo que busca alguien que todavía no lo conoce.
    h1          = "Psiquiatra en Santa Cruz de la Sierra"
    subheadline = "Autismo, TDAH y adicciones"

    # `name` también alimenta `alternateName` en el JSON-LD; no lo borres sin
    # revisar layouts/partials/schema.html.
    name        = "Dr. Miguel de la Oliva"
    intro       = "Soy el Dr. Miguel de la Oliva. Creo profundamente que cada persona merece ser escuchada, aceptada e incluida en nuestra sociedad."

    # El retrato es de estudio: bata blanca, fondo liso. El texto alternativo
    # describe lo que se ve, no un consultorio que la foto no muestra.
    photo       = "/images/profile-miguel-oliva.jpg"
    photoAlt    = "El Dr. Miguel de la Oliva, con bata blanca, mirando de frente a la cámara."

  # Todo lo que necesita layouts/partials/whatsapp-cta.html, que es el único
  # lugar donde se arma el enlace. (`cta = "Hablemos"` vivía en [params.hero];
  # se movió acá porque la misma etiqueta la usan el héroe, la franja del medio
  # y la barra fija.)
  [params.whatsapp]
    # La etiqueta de los enlaces que abren WhatsApp de verdad: el del redactor y
    # el del número, en la sección de contacto. Lo dice el doctor, así que va en
    # usted, como todo lo que él le dice a quien lee (CLAUDE.md, «Language»).
    label = "Escríbame por WhatsApp"

    # La etiqueta de los CTA que llevan al redactor —héroe, franja del medio y
    # barra fija— y no a WhatsApp. Dice las dos cosas a propósito: quién recibe
    # el mensaje y que no hay que escribirlo en frío. Un botón que dijera
    # «Escríbame por WhatsApp» y en vez de eso bajara la página estaría
    # prometiendo una cosa y haciendo otra.
    composerLabel = "Escríbame — le ayudo con el mensaje"

    # El mensaje llega escrito para que nadie tenga que redactar en frío la
    # primera frase sobre su salud mental. Lo escribe el visitante, no el
    # doctor: va en primera persona y lo trata de usted. Es una apertura, no una
    # historia clínica — no da por hecho ningún diagnóstico. Queda para el enlace
    # del número en la sección de contacto y para la lista de motivos que se ve
    # sin JavaScript; los CTA generales ya no abren WhatsApp, llevan al redactor.
    # «Hola, doctor.» con coma vocativa y punto, igual que `plantilla.sinNombre`
    # en data/motivos.yaml: los dos son la primera frase del mismo mensaje según
    # por dónde se entre, y no deberían saludar de dos maneras distintas.
    defaultMessage = "Hola, doctor. Le escribo desde su página web porque me gustaría consultar con usted. ¿Podemos coordinar una cita?"

# Google Analytics 4. El ID vive acá, y no en [params], porque es de donde lo lee
# `site.Config.Services.GoogleAnalytics.ID` — una clave en [params] sería invisible
# tanto para esa variable como para la configuración de privacidad de abajo.
# layouts/partials/analytics.html no emite nada si el ID está vacío, así que un
# build sin ID queda limpio.
[services.googleAnalytics]
  ID = "G-DPX00H2N9R"

# `respectDoNotTrack = true` ya es el valor por defecto en Hugo 0.164; queda
# explícito para que la intención sobreviva un cambio de ese valor por defecto.
# Ojo: la plantilla interna de Hugo lo respeta a medias — ver el comentario en
# layouts/partials/analytics.html, que es la razón por la que no la usamos.
[privacy.googleAnalytics]
  respectDoNotTrack = true

[markup.goldmark.renderer]
  unsafe = true

[minify]
  disableXML   = true
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS"]

[sitemap]
  changefreq = "monthly"
  filename   = "sitemap.xml"
  priority   = 0.5

[security]
  [security.funcs]
    getenv = ["^HUGO_", "^CI$"]
