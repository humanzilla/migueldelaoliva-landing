{{- /* Google Analytics 4 — instalación propia, no la plantilla interna de Hugo.

       POR QUÉ NO `_internal/google_analytics.html`: esa plantilla emite el
       <script async src="…/gtag/js"> fuera del control de Do Not Track, y
       `respectDoNotTrack` sólo se salta la llamada a `config`. Es decir, quien
       pide DNT igual descarga gtag.js y aparece en los registros de Google. W14
       dejó la página en cero peticiones a terceros hasta que alguien las pide;
       acá el chequeo de DNT va ANTES de crear el <script>, así que quien pide
       DNT no genera ninguna petición a Google. (De paso, esa plantilla declara
       `gtag` dentro de un bloque `if`, con lo cual queda indefinida bajo DNT.)

       PRIVACIDAD — esto es una regla, no una preferencia: de acá sale cuántas
       visitas hay, dónde se tocó un CTA que lleva al redactor y dónde se abrió
       WhatsApp. Nunca sale el motivo de consulta ni ningún dato de salud. La
       lista blanca que lo garantiza está en assets/js/main.js. Ver W15 en
       TODO.md y la prohibición 6 de CLAUDE.md.

       El ID sale de [services.googleAnalytics] en hugo.toml. Si está vacío esto
       no emite nada, así que un build sin ID queda limpio. */ -}}

{{- $id := site.Config.Services.GoogleAnalytics.ID -}}
{{- if and $id (not site.Config.Privacy.GoogleAnalytics.Disable) }}
<script>
  (function () {
    {{- if site.Config.Privacy.GoogleAnalytics.RespectDoNotTrack }}
    var dnt = navigator.doNotTrack || window.doNotTrack || navigator.msDoNotTrack;
    if (dnt === '1' || dnt === 'yes') return;
    {{- end }}

    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };
    gtag('js', new Date());

    // Sin señales de Google ni personalización de anuncios: este tráfico no
    // alimenta audiencias publicitarias ni informes demográficos. En un sitio de
    // psiquiatría eso importa más que el dato que se pierde.
    gtag('config', {{ $id }}, {
      allow_google_signals: false,
      allow_ad_personalization_signals: false
    });

    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent({{ $id }});
    document.head.appendChild(s);
  })();
</script>
{{- end -}}
