# Redactor del primer mensaje de WhatsApp.
#
# La barrera real de una primera consulta psiquiátrica no es el precio: es no
# saber cómo empezar a escribir. Acá el mensaje se arma con dos elecciones —qué
# le trae y para quién es— y se abre WhatsApp con el texto ya cargado.
#
# Este archivo es la ÚNICA fuente de esas frases. Lo lee el servidor, para
# armar los enlaces que funcionan sin JavaScript, y lo lee Alpine, que recibe
# este mismo contenido como JSON. Si cambiás una frase acá, cambian las dos
# versiones a la vez; no hay copia en el JavaScript.
#
# QUIÉN HABLA: los mensajes los escribe el VISITANTE, no el doctor. Van en
# primera persona y lo tratan de usted, que es como un cruceño le escribe a un
# psiquiatra que todavía no conoce. Este archivo tuvo razón antes que el resto
# del sitio: desde 2026-08-12 el doctor también trata de usted a quien lee, así
# que el trato es simétrico y ya no hay que explicar la diferencia.
#
# QUÉ NO DICEN: ninguno da por hecho un diagnóstico. Por eso «una evaluación
# relacionada con autismo» y no «tengo autismo», y por eso «un consumo que me
# preocupa» y no una etiqueta sobre la persona. Son aperturas, no historias
# clínicas.
#
# ANALÍTICA: los `id` son internos y no se envían. Todos los enlaces salen con
# data-cta="motivo" a secas — el motivo de una consulta psiquiátrica unido al
# identificador de un dispositivo es un dato de salud. Ver W15 en TODO.md y la
# prohibición 6 de CLAUDE.md.

# Piezas del mensaje. Los marcadores {nombre}, {motivo} y {persona} se
# reemplazan igual en Hugo (`replace`) y en Alpine (`String.replace`).
plantilla:
  sinNombre: "Hola, doctor."
  conNombre: "Hola, doctor. Soy {nombre}."
  motivo: "Quisiera agendar una consulta por {motivo}."
  persona: "Es {persona}."
  cierre: "¿Qué horarios tiene disponibles?"

# Paso 1 — qué le trae. `frase` entra en «Quisiera agendar una consulta por …»,
# así que va en minúscula y sin punto final.
motivos:
  - id: autismo
    label: Autismo
    frase: "una evaluación relacionada con autismo"

  - id: atencion
    label: Atención y TDAH
    frase: "dificultades de atención y organización"

  - id: consumo
    label: Consumo
    frase: "un consumo que me preocupa"

  - id: ansiedad
    label: Ansiedad
    frase: "ansiedad o angustia que no baja"

  - id: animo
    label: Ánimo bajo
    frase: "ánimo bajo y desgano"

  - id: familia
    label: Orientación familiar
    frase: "orientación como familia"

  # Para quien llega hasta acá y no se reconoce en ninguna de las anteriores.
  # La franja del medio de la página ya dice «no hace falta que tenga las
  # palabras exactas»; esta opción es esa misma frase, elegible.
  - id: no-se
    label: Todavía no sé
    frase: "algo que todavía no sé bien cómo explicar"

# Paso 2 — para quién es. `frase` entra en «Es …».
personas:
  - id: mi
    label: Para mí
    frase: "para mí"

  - id: hijo
    label: Para mi hija o hijo
    frase: "para mi hija o hijo"

  - id: familiar
    label: Para un familiar
    frase: "para mi pareja o un familiar"
