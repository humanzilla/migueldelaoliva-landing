# `text` es lo que se muestra en la página, en orden.
#
# `credentialCategory` es opcional y marca las líneas que son un título formal:
# sólo ésas se publican en el JSON-LD como EducationalOccupationalCredential.
# Las líneas sin esa clave son experiencia o contexto, no títulos, y se quedan
# fuera del schema a propósito — no las conviertas en credenciales.
- text: Psiquiatra con más de 15 años de experiencia clínica
- text: Máster en Trastornos del Espectro Autista
  credentialCategory: Máster
- text: Especialista en Tratamiento de Adicciones
  credentialCategory: Especialidad
- text: Convencido de que cada historia merece ser comprendida
