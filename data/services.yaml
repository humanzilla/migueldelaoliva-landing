- title: Consulta psiquiátrica integral
  description: |
    En el espacio de la entrevista clínica, creamos una realidad que nos
    permite llegar a la dolencia que le lleva a buscar un apoyo.

    Creamos un plan realista y respetuoso con su proceso, no con un ideal inalcanzable.
- title: Acompañamiento en autismo
  description: |
    Comprender el autismo desde una mirada humana, sin prejuicios ni etiquetas.
    No solo desde la ciencia, también desde el activismo, el arte, la educación
    y la experiencia personal. Porque el autismo no es una frontera a cruzar,
    sino una forma distinta —y valiosa— de habitar el mundo.
- title: Recuperación de adicciones
  description: |
    La adicción no es falta de voluntad. Es una enfermedad compleja que requiere
    comprensión, estrategia y mucha compasión. Trabajamos juntos hacia su libertad.
- title: Terapia familiar
  description: |
    Sanar no es tarea de uno solo. Es un proceso que nos incluye a todos.
    Involucro a la familia porque todos necesitan herramientas, todos necesitan sanar,
    y juntos son más fuertes.
- title: Educación comunitaria
  description: |
    Informar también es cuidar.

    Doy charlas, escribo y creo contenido para romper el silencio, el miedo y el estigma.
    Una comunidad informada es una comunidad que abraza.
- title: Inclusión
  description: |
    Trabajo para cambiar sistemas, políticas y mentalidades. Porque no basta con tratar
    individuos si el mundo sigue siendo hostil para quienes son diferentes.
